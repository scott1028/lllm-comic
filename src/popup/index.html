<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Large Image Spotter</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1>大型圖片偵測</h1>
      <label class="toggle"><input type="checkbox" id="is-enabled" /> 啟用</label>
    </header>

    <fieldset>
      <legend>符合方式</legend>
      <label><input type="radio" name="match-mode" value="all" /> 全部符合 (AND)</label>
      <label><input type="radio" name="match-mode" value="any" /> 任一符合 (OR)</label>
    </fieldset>

    <ul id="rules"></ul>
    <p id="empty-hint" hidden>沒有規則時，不會標示任何圖片。</p>
    <button id="add-rule" type="button">+ 新增規則</button>

    <fieldset id="translation">
      <legend>漫畫翻譯</legend>
      <label class="toggle"><input type="checkbox" id="is-translation-enabled" /> 啟用翻譯</label>
      <label>目標語言 <input id="target-language" type="text" /></label>
      <label>
        文字大小
        <select id="min-font-size" title="譯文最小字級；框夠大時會自動放大">
          <option value="12">12 px</option>
          <option value="14">14 px</option>
          <option value="16">16 px</option>
          <option value="18">18 px</option>
          <option value="20">20 px</option>
          <option value="22">22 px</option>
          <option value="24">24 px</option>
          <option value="26">26 px</option>
          <option value="28">28 px</option>
          <option value="30">30 px</option>
          <option value="32">32 px</option>
          <option value="34">34 px</option>
          <option value="36">36 px</option>
        </select>
      </label>
      <label>API URL <input id="api-base-url" type="url" placeholder="http://127.0.0.1:8888/v1" /></label>
      <label>API key <input id="api-key" type="password" autocomplete="off" /></label>
      <label>
        模型
        <span class="clearable">
          <input id="model" type="text" list="model-options" placeholder="server 上的模型名稱" />
          <button type="button" class="clear" aria-label="清除模型">✕</button>
        </span>
      </label>
      <datalist id="model-options"></datalist>
      <label>
        思考程度
        <span class="clearable">
          <input id="reasoning-effort" type="text" list="reasoning-options" placeholder="空白 = 由 server 決定" />
          <button type="button" class="clear" aria-label="清除思考程度">✕</button>
        </span>
      </label>
      <datalist id="reasoning-options">
        <option value="none" label="關閉思考 (最快)"></option>
        <option value="minimal"></option>
        <option value="low"></option>
        <option value="medium"></option>
        <option value="high"></option>
        <option value="xhigh"></option>
        <option value="max"></option>
      </datalist>
      <p id="api-status"></p>
    </fieldset>

    <template id="rule-template">
      <li class="rule">
        <select name="metric" aria-label="指標">
          <option value="fileSizeKB">檔案大小</option>
          <option value="width">寬度</option>
          <option value="height">高度</option>
          <option value="oversizeRatio">原圖倍率</option>
        </select>
        <select name="operator" aria-label="比較">
          <option value=">=">≥</option>
          <option value="<=">≤</option>
        </select>
        <input name="value" type="number" min="0" step="any" aria-label="數值" />
        <span class="unit"></span>
        <button type="button" class="remove" aria-label="刪除規則">✕</button>
      </li>
    </template>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
